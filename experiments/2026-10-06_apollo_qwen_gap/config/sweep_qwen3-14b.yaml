# Every layer of Qwen3-14B, both readouts, Apollo's recipe: is Qwen3-32B an outlier or the end of a size trend in Qwen3?
# Identical to sweep_qwen3-8b.yaml except the model, run name and layer count.
run: 2026-10-07_apollo-sweep_qwen3-14b
model: Qwen/Qwen3-14B
revision: 40c069824f4251a91eefaf281ebe4c544efd3e18  # the only snapshot on this experiment's Volume (refs/main), the one the sweep read
tokenizer: Qwen/Qwen3-14B
weights: own                 # downloaded to this experiment's Modal Volume (hf-hub/)
dtype: bfloat16
n_gpus: 1
chat_template: {enable_thinking: false}
readouts: [block_output, apollo]
layers: all                  # 0..39
eval_sets: [roleplaying_llama-70b-3.3, roleplaying_qwen3-32b]
train_data: repe_honesty__plain
detect: statement minus its last five words; statements of five words or fewer give no tokens (31 of 306)
reg_coeff: 10
max_iter: 2000
val_fraction: 0.2
split_seed: 0
aggregation: mean of per-token scores over the detected tokens
fit_workers: 8
blas_threads_per_fit: 2
pilot: {pairs: 40, eval_every: 12}
