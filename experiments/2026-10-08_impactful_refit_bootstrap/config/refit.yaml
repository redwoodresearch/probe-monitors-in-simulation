# Impactful-command probe, off-policy 2x2 with a bootstrap that refits (2026-10-08; Aswin's OK via the orchestrator,
# about $30, cap $45; after the pilot, option A: about $60, stop $75). Attack runs, the matched calls (probe_shift.eligibility.matched_call: the last argument is the
# non-empty command parameter, so call_end reads the on-policy readout's token), call_end
# readout, 16 candidate layers. Each replicate resamples main tasks and redoes layer and C choice, fitting and
# calibration. Folds per outer fold f: test f, calibration f+1, validation f+2, inner training f+3 and f+4 (mod 5);
# the final probe is refit on the validation and inner-training folds.
