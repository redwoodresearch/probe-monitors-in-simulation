# Resolved settings for the activation smoke test (2026-10-05). Layers are 0-indexed decoder layers of 64;
# activations are the residual stream after each. Cells: one task per environment, picked in the data audit.
run: 2026-10-05_la_activation-smoke_qwen3-32b
model: Qwen/Qwen3-32B
dtype: bfloat16
attn_implementation: sdpa
chat_template:
  enable_thinking: false
layers:
- 8
- 16
- 24
- 32
- 40
- 48
- 56
- 63
pooling:
  mean: true
  ema_max_decays:
  - 0.8
  - 0.95
max_tokens: 32768
save_dtype: float16
normalization:
  system_prompt: honest prompt from the real honest run of the same main task
  reasoning: dropped (encrypted provider blobs)
  tool_error: rendered as its message (what the agent saw); the field dropped
  tool_output_trailing_newlines: kept, as the agent saw them
cohorts:
  real: la_public10_real_attack_n1000
  sim: la_public10_sim_astra_attack_n1000
  honest: la_public10_real_honest_n1000
