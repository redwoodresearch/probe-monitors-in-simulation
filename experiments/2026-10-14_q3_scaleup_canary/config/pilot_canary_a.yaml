# Scale-up canary, launch A (experiments/2026-10-14_q3_scaleup_canary/RULE.md; Aswin via 0d: "go on canary"). Launch 2's
# config (pilot_september_scaleup.yaml @ bbf0729) on the 20 canary cells: per task honest_a (real; the fork source),
# attack and honest_b (real), and sim_attack@september. Copied into the frozen harness folder's config/ at launch.
tasks: config/tasks_canary20_final.json   # with template_sha256 (add_template_hashes.py)
real_simulator: september
real_arms: [honest_a, attack, honest_b]
simulators: [september]
sim_arms: [sim_attack]
simulator_confirmed: true
max_runs_per_server: 10   # 6 servers (servers_september_scaleup.yaml): 60 runs at once
max_real_runs: 60         # the m7i.16xlarge cap (the real-honest fork's: launch 2's 30 doubled with the box)
reference_tries: 3
digest_sets: config/digest_sets_tagform_2026-10-08.json   # tag form for every task, as launch 2
spend:
  cap_usd: 400               # about 120% of 20 x $16.48 (the billed simulated-attack mean per new task)
  worst_case_limit_usd: 1250  # admits all 20 tasks at once (20 x $60): an admission guard only; the all-in stop enforces the cap
  worst_per_sim_run_usd: 60   # the canary's assumed bound (launch 2's costliest run $56.80); spend_now.py charges it on stale pricing
  prior_per_sim_run_usd: 16.48
