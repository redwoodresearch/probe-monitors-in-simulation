# Rules applied to every flag in the analysis (derived from this audit, fixed before any score is looked at):
rules:
  clipped_sim: drop        # a sim flag on an output the reader saw clipped (the judge saw the full simulator output)
  clipped_real: keep       # real outputs are stored clipped, so judge and reader saw the same text
  cites_later: delay       # visible only from the turn of the latest cited action (conservative: corroborating citations also delay)
  uncited_later: drop      # reason says later/subsequent/afterward without an action number: time unknown
  other_transcript: keep   # the flagged output is in the reader's history; the comparison is not (a limitation)
