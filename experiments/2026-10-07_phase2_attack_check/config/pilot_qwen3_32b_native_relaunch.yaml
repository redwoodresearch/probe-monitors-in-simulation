# Relaunch of the remaining 38 runs (19 tasks: run_pilot.py --tasks, every task but t17_slack_clone, whose 2 runs
# finished in 2026-10-09_121200_qwen3_32b_native), all at once on 4 servers (servers_qwen3_32b_native_fast.yaml). The
# canary passed in that launch, so there's no gate here; canary_watch.py --abort-missing-only still stops the launch
# on any str_replace whose new_str is missing (an empty string is the model's own deletion: counted, not an abort).
# Otherwise as pilot_qwen3_32b_native.yaml (40,960-token window, no YaRN, 8,192-token replies, "out of context" at a
# prompt over 32,768 tokens, counted as a failure and reported apart). The relaunch as run (2026-10-09 12:31 PT):
#   launch_servers.py --count 4 --server-config servers_qwen3_32b_native_fast.yaml   # that config is added in #281
#   PATH=$PWD/fixed_digest_lookup:$PATH IMAGES_JSON=<setup_devbox images.json> run_pilot.py \
#       --pilot-config config/pilot_qwen3_32b_native_relaunch.yaml --tasks <the 19 task keys, every one but
#       t17_slack_clone> --base-urls <4 servers> --commit <commit> --out <run dir>
#   canary_watch.py <run dir> t01_media_processing --open-on-clean-finish --abort-missing-only
#       # no gate in this launch: the watcher only aborts on a missing new_str. Any task key with real runs serves;
#       # --open-on-clean-finish keeps it watching after that task's runs finish.
# Reporting reads each sample's messages (the transcript the run kept), not its model events: an out-of-context run's
# last model event is the discarded call (analyze_attack_check.conversation() would restore it).

tasks: config/pilot_tasks_amendment9.json
real_simulator: september_ctx   # September's tree plus config/policy_context_guard.patch (config/run.yaml)
simulators: []
real_arms: [honest_a, honest_b]
policy: vllm/Qwen/Qwen3-32B
server_checks: [tiny, repetition]
policy_limits:
  max_tokens: 8192        # per reply (run.yaml's 32,768 would leave no room in a 40,960 window)
  context_window: 40960   # the server's --max-model-len

# 2 servers x 5 runs = the devbox's 10 real runs at once. Qwen3-32B's KV cache is ~0.26 MB a token (64 layers, 8 KV
# heads, 128 dims, bf16), so 5 runs at 40,960 tokens need ~54 GB beside the 64 GB of weights on an H200.
max_runs_per_server: 10
max_real_runs: 38
reference_tries: 1   # A's first try only, never redrawn: there is no simulated arm to need a usable reference
digest_sets: config/digest_sets_tagform_2026-10-08.json

spend:  # no simulator: API spend is zero; the guard is inert but required by run_pilot.py
  cap_usd: 0
  worst_case_limit_usd: 1
  worst_per_sim_run_usd: 0
  prior_per_sim_run_usd: 0
