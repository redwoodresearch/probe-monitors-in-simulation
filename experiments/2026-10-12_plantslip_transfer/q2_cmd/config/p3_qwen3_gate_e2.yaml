# Planted slips P3 (PINS.md): the second-run gate (Aswin's matched-subset decision, 10-12). Qwen3-32B reads the 20
# unplanted e2 controls as the P3 gate read the e1 ones (32k cut, bfloat16, sdpa, layers 8 and 16, stop after 16); their
# scores must reproduce the dump 2026-10-06_la_segment-end_qwen3-32b_alllayers_v1's within 1e-3.
run: 2026-10-12_q2_plantP3_gate-e2_qwen3-32b_v1
