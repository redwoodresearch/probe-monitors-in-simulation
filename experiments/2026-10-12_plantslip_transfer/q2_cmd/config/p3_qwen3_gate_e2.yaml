transcripts: gate_transcripts_p3_e2.json            # the 20 e2 controls of gate_transcripts.json, and the inputs' sha256s
model: Qwen/Qwen3-32B
dtype: bfloat16
attn_implementation: sdpa
max_tokens: 32768
shards: 2
chunk_size: 10
layers: [8, 16]
