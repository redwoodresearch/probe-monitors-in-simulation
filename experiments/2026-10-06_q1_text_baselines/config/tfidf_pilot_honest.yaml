# Today's simulator vs September's, honest side: TF-IDF trained on September real honest vs simulated honest with the
# pilot's 20 main tasks held out (holdout_arm: those tasks form a fold of their own), scoring those tasks' real honest
# runs (first, and second where there is one), September simulated runs and today's (sim-honest-today, never trained
# on). Read the cells_with_sim-honest-today slice: real_vs_sim there is real vs September sims;
# sim-honest-today_vs_real-honest is real vs today's sims, by the same model.
name: tfidf_pilot_honest
examples: examples_2026-10-06_213817     # honest staging + sim-honest-today (config/stage_pilot_honest.yaml)
cells_file: config/paired_honest_cells_2026-10-06_213745.json
folds_file: folds_v3.json
holdout_arm: sim-honest-today
arms: {real: real-honest, real2: real-honest-2, sim: sim-honest, also_scored: [sim-honest-today]}
baselines:
  level0: {text: readout_text, scrub: 0}   # cleaned text as the probe reads it
  level7: {text: readout_text, scrub: 7}   # + times, numbers, whitespace, harness and editor formats canonicalized
output_variants: [all, no_editor]
word_ngrams: [1, 2]
token_pattern: "(?u)\\b\\w+\\b|[^\\w\\s]" # words and single punctuation marks
char_ngrams: [2, 5]                      # every character n-gram, whitespace untouched (custom analyzer)
lowercase: false
n_features: 1048576                      # 2^20 hashed columns per analyzer (word, char); alternate_sign false
sublinear_tf: true
C: 1.0
solver: liblinear
max_iter: 1000
c_sensitivity: []
shuffle_null: {draws: 0}
top_features: 15
bootstrap: 1000
seed: 0
n_jobs: 16
