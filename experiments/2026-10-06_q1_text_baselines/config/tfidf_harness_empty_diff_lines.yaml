# Level 6 = level 5 plus empty added/removed lines dropped from editor diffs (see results/diff_pattern_2026-10-06_145927.md).
# Level 5 = harness format (level 4) plus diff lines canonicalized: real diffs put one space after the +/- sign and
# simulated ones don't, so it is removed with the gutter; hunk headers reduced to "@@". Main-task folds.
# Harness-format normalized (scrub level 4, applied to both arms): ladder step 3 (times, numbers and IDs, whitespace)
# plus real editor diffs' line-number gutter stripped (so editor outputs render like simulated ones and can stay in),
# stderr-looking lines dropped, weekday and month names masked, blank lines removed and spaces collapsed. The
# "realism beyond formatting" number. tfidf_cleaned reruns step 0 on the leading-content-fixed staging, to measure that fix.
name: tfidf_harness_empty_diff_lines
examples: examples_2026-10-06_142532
folds_file: folds_v3.json
baselines:
  harness_normalized_empty_diff_lines: {text: readout_text, scrub: 6}   # level 5 + empty added/removed diff lines dropped
output_variants: [all]                   # level 6 only changes editor diffs; no_editor equals level 5
word_ngrams: [1, 2]
token_pattern: "(?u)\\b\\w+\\b|[^\\w\\s]" # words and single punctuation marks
char_ngrams: [2, 5]                      # every character n-gram, whitespace untouched (custom analyzer; sklearn "char" collapses whitespace runs)
lowercase: false
n_features: 1048576                      # 2^20 hashed columns per analyzer (word, char); alternate_sign false
sublinear_tf: true                       # TfidfTransformer: tf -> 1 + log(tf); smooth_idf true; l2 row norm
C: 1.0                                   # fixed a priori (sklearn default); c_sensitivity is reported, not used to choose
solver: liblinear
max_iter: 1000
c_sensitivity: []
shuffle_null: {draws: 0}
top_features: 15
bootstrap: 1000
seed: 0
n_jobs: 16
