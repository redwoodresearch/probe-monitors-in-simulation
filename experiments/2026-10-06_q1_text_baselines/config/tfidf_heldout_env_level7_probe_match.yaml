# Level 7 (editor output format canonicalized), held-out environment folds, all outputs and no editor: per-output
# scores for the main session's paired probe-minus-TF-IDF test on its level-7 probe.
name: tfidf_heldout_env_level7_probe_match
examples: examples_2026-10-06_142532     # staging with the leading-content fix (readout text keeps the output's first characters)
folds_file: folds_v3.json
fold_scheme: environment
baselines:
  harness_normalized_editor_format: {text: readout_text, scrub: 7}   # level 6 + editor output format canonicalized
output_variants: [all, no_editor]
word_ngrams: [1, 2]
token_pattern: "(?u)\\b\\w+\\b|[^\\w\\s]" # words and single punctuation marks
char_ngrams: [2, 5]                      # every character n-gram, whitespace untouched (custom analyzer; sklearn "char" collapses whitespace runs)
lowercase: false
n_features: 1048576                      # 2^20 hashed columns per analyzer (word, char); alternate_sign false
sublinear_tf: true                       # TfidfTransformer: tf -> 1 + log(tf); smooth_idf true; l2 row norm
C: 1.0                                   # fixed a priori (sklearn default); c_sensitivity is reported, not used to choose
solver: liblinear
max_iter: 1000
c_sensitivity: []
shuffle_null: {draws: 0}
top_features: 15
bootstrap: 1000
seed: 0
n_jobs: 16
