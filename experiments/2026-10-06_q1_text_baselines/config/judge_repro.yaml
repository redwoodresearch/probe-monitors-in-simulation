# Reproduce the paper's judge on a random sample of our pairs (run_judge_repro.py). Settings copied from the paper's
# archived run (experiments/2026-09-21_linuxarena_sol_discriminator/run.py in its evidence archive).
model: openai/gpt-5.6-sol
reasoning_effort: medium
max_concurrent: 100
prompt: simulated-control-evals src/metrics/discriminator/prompts/pair_2afc.md   # digest must match the stored runs
orders_per_pair: 2                       # real in A, then real in B (discriminate_pair)
n_pairs: 50                              # random cells among those with a stored verdict
seed: 0
stored_judge: gpt-5.6-sol_medium
stored_pairs: paper_judge_pairs_2026-10-06_123010.jsonl      # results/, analyze_paper_judge.py: the 590 under-32k cells only (130221 holds all 938)
stored_summary: paper_judge_summary_2026-10-06_123010.json
examples: examples_2026-10-06_122337     # .run_cache/ staging run the reproduction used (v2): file, sample ID and epoch of each run
cohorts:
  real: la_public10_real_attack_n1000
  simulated: la_public10_sim_astra_attack_n1000
run_name: q1-baselines_judge-repro       # cache and cost-ledger label (JudgeClient)
# Cost estimate (preflight only)
chars_per_token: 3.5
price_per_mtok_input: 5.0                # gpt-5.6-sol, sce sim/prices.py
price_per_mtok_output: 30.0
output_tokens_per_call: 1500
paper_usd_per_pair: 0.665                # the paper's Sol-medium run: $633.29 for 953 pairs
bootstrap: 1000
