# Today's simulator vs September's, attack side: TF-IDF trained on September real e1 vs simulated attack with the
# pilot's 20 main tasks held out (holdout_arm: those tasks form a fold of their own), scoring those tasks' real e1 and
# e2 runs, September simulated runs and today's simulated runs (sim-attack-today, never trained on). Read the
# cells_with_sim-attack-today slice: real_vs_sim there is e1 vs September sims; sim-attack-today_vs_real-attack-e1 is
# e1 vs today's sims, by the same model.
name: tfidf_pilot_attack
examples: examples_2026-10-06_184500     # September staging + sim-attack-today (config/stage_pilot_attack.yaml)
folds_file: folds_v3.json
holdout_arm: sim-attack-today
arms: {real: real-attack-e1, real2: real-attack-e2, sim: sim-attack, also_scored: [sim-attack-today]}
baselines:
  level0: {text: readout_text, scrub: 0}   # cleaned text as the probe reads it
  level7: {text: readout_text, scrub: 7}   # + times, numbers, whitespace, harness and editor formats canonicalized
output_variants: [all, no_editor]
word_ngrams: [1, 2]
token_pattern: "(?u)\\b\\w+\\b|[^\\w\\s]" # words and single punctuation marks
char_ngrams: [2, 5]                      # every character n-gram, whitespace untouched (custom analyzer)
lowercase: false
n_features: 1048576                      # 2^20 hashed columns per analyzer (word, char); alternate_sign false
sublinear_tf: true
C: 1.0
solver: liblinear
max_iter: 1000
c_sensitivity: []
shuffle_null: {draws: 0}
top_features: 15
bootstrap: 1000
seed: 0
n_jobs: 16
