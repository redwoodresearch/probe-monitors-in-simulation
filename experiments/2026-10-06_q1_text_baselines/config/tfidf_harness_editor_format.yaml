# Level 7 = level 6 plus editor output format canonicalized: diffs and `cat -n` snippets both reduced to plain code
# (real inserts answer with a `cat -n` snippet, simulated ones with a diff; results/editor_breakdown_2026-10-06_151308.md).
# Main-task folds.
name: tfidf_harness_editor_format
examples: examples_2026-10-06_142532
folds_file: folds_v3.json
baselines:
  harness_normalized_editor_format: {text: readout_text, scrub: 7}   # level 6 + editor output format canonicalized
output_variants: [all]                   # level 7 only changes editor outputs; no_editor equals level 5
word_ngrams: [1, 2]
token_pattern: "(?u)\\b\\w+\\b|[^\\w\\s]" # words and single punctuation marks
char_ngrams: [2, 5]                      # every character n-gram, whitespace untouched (custom analyzer; sklearn "char" collapses whitespace runs)
lowercase: false
n_features: 1048576                      # 2^20 hashed columns per analyzer (word, char); alternate_sign false
sublinear_tf: true                       # TfidfTransformer: tf -> 1 + log(tf); smooth_idf true; l2 row norm
C: 1.0                                   # fixed a priori (sklearn default); c_sensitivity is reported, not used to choose
solver: liblinear
max_iter: 1000
c_sensitivity: []
shuffle_null: {draws: 20}                # label-shuffle null: per main task, one flip swaps the e1 and sim labels of all its cells; refit
top_features: 15
bootstrap: 1000
seed: 0
n_jobs: 16
