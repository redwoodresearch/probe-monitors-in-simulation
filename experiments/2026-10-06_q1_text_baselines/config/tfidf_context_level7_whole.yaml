variants:
  level7_whole_own_output:
    outputs: harness_normalized_editor_format_whole_scores_2026-10-06_194442.jsonl.gz   # tfidf_level7_whole rerun, main-task folds (the 190302 file was overwritten by the held-out-environment run; see README)
