# Scale-up +311, quarter Q4 (experiments/2026-10-14_q3_scaleup_311/RULE.md; Aswin via 0d: "i approve scale up, just run things
# and get me results quickly, ensure correctness and speed"). The canary's launch A config (pilot_canary_a.yaml) on this
# box's cells: per cell honest_a (real; the fork source), attack and honest_b (real) and sim_attack@september; plus each
# cell's `<key>_r2` entry (real_arms [attack]): its second real attack, in this same launch (scaleup_r2_arms.patch).
tasks: config/tasks_311_q4_launch.json   # make_q4_with_canary.py -> add_r2.py: Q4's 77 cells + the canary's 8 overlap cells (85)
real_simulator: september
real_arms: [honest_a, attack, honest_b]
simulators: [september]
sim_arms: [sim_attack]
simulator_confirmed: true
max_runs_per_server: 10   # 8 servers (servers_september_scaleup.yaml): 80 runs at once (6 servers: 60)
max_real_runs: 60         # the 64-vCPU box's cap, as the canary and the real-honest launch
reference_tries: 3
digest_sets: config/digest_sets_tagform_2026-10-08.json   # tag form for every task, as launch 2 and the canary
spend:
  cap_usd: 1550              # projected simulator spend on new tasks (85 x $16.48 = $1,401, +11%); the quarter's all-in stop enforces its cap
  worst_case_limit_usd: 5200  # admits every cell at the $60 worst case (85 x $60): an admission guard only
  worst_per_sim_run_usd: 60   # the canary's bound; spend_now.py charges it on stale pricing
  prior_per_sim_run_usd: 16.48
