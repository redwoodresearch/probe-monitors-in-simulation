  slug: destructive_transfer
  title: 'Destructive and data-transfer monitors: real and simulated catch agree within 10 points at 5% false alarms; not established at 1%'
  caption: 'Q2.5: reading Sol''s honest runs, real − simulated catch is +2.8 points [−3.1, +9.7] (destructive) and +6.8 [−1.0, +12.5] (data transfer) at 1% false alarms, and +0.5 and +0.8 at 5%; under the post hoc ±10-point margin both agree at 5% after Holm, at 1% neither is established, and nothing is established at ±5, where even two real runs can''t be shown to agree (destructive −4.4 [−12.2, +4.4] at 1%; #532).'
