# Morning figures spec: what each figure draws and where each number comes from (read by plot_morning_figures.py).
figures:
- fig: Q2.1
  slug: offpolicy_catch
  title: Reading Sol's runs, the monitor catches simulated and real impactful commands alike
  caption: 'Q2.1: reading Sol''s runs (530 tasks: 522 per world, 514 in both), the real-trained monitor catches 90.8% of real vs 90.8% of simulated impactful commands at 1% false alarms (+0.06 points [−1.07, +1.34]); with the published monitor, real − simulated (+0.02) is no larger than two real runs (+0.40), and 5 points is ruled out for both (published-monitor control on open PR #499).'
  panels:
  - title: Caught at 1% false alarms (refit monitor)
    kind: bars
    unit: percent
    ylabel: "Impactful commands caught (%)\n(higher is better)"
    bars:
    - {label: Real, role: real, ref: 5564a2ee2e64, path: experiments/2026-10-09_q2_tpr_at_1pct/README.md, scale: 100, value: 90.81, lo: 85.13, hi: 93.64, quote: 'real->real: TPR 0.9081 [0.8513, 0.9364]', n: 522 tasks, n_quote: 522 tasks in each world, raw: ['0.9081', '0.8513', '0.9364']}
    - {label: Simulated, role: sim, ref: 5564a2ee2e64, path: experiments/2026-10-09_q2_tpr_at_1pct/README.md, scale: 100, value: 90.75, lo: 84.75, hi: 93.61, quote: 'real->sim: TPR 0.9075 [0.8475, 0.9361]', n: 522 tasks, n_quote: 522 tasks in each world, raw: ['0.9075', '0.8475', '0.9361']}
  - title: Gaps, with the ±5-point line
    kind: bars
    unit: points
    ylabel: "Difference (points)\n(closer to 0 is better)"
    lines:
    - {y: 5, label: '+5', source: {ref: e577e6cf107e, path: experiments/2026-10-10_route3_phase1_e2/README.md, quote: '''5-point gap ruled out'': True', raw: '5', scale: 1, pm: true}}
    - {y: -5, label: −5, source: {ref: e577e6cf107e, path: experiments/2026-10-10_route3_phase1_e2/README.md, quote: '''5-point gap ruled out'': True', raw: '5', scale: 1, pm: true}}
    bars:
    - {label: "Real − simulated\n(refit)", role: gap, ref: 5564a2ee2e64, path: experiments/2026-10-09_q2_tpr_at_1pct/README.md, scale: 100, value: 0.06, lo: -1.07, hi: 1.34, quote: '"catch, frozen training-world threshold": {"value": 0.0006, "ci95": [-0.0107, 0.0134]}', raw: ['0.0006', '-0.0107', '0.0134']}
    - {label: "Real run 1 − simulated\n(published monitor)", role: gap, ref: e577e6cf107e, path: experiments/2026-10-10_route3_phase1_e2/README.md, scale: -100, value: 0.02, lo: -1.07, hi: 1.22, quote: "gap sim-e1 {'catch@0.01': -0.0002, 'false_alarms@0.01': -0.0005, 'catch@0.05': -0.0004, 'false_alarms@0.05': -0.0002, 'auroc': -0.0008}\n  ci95 {'catch@0.01': [-0.0122, 0.0107]", raw: ['-0.0002', '0.0107', '-0.0122']}
    - {label: "Real run 2 − run 1\n(published monitor)", role: control, ref: e577e6cf107e, path: experiments/2026-10-10_route3_phase1_e2/README.md, scale: 100, value: 0.4, lo: -0.65, hi: 1.35, quote: "gap e2-e1 {'catch@0.01': 0.004, 'false_alarms@0.01': -0.0024, 'catch@0.05': -0.0007, 'false_alarms@0.05': -0.0054, 'auroc': 0.0007}\n  ci95 {'catch@0.01': [-0.0065, 0.0135]", raw: ['0.004', '-0.0065', '0.0135']}
- fig: Q2.2
  slug: onpolicy_catch_196
  title: With Qwen acting on 196 tasks, a 10-point catch gap is ruled out at the frozen threshold; the post hoc recalibration is inconclusive
  caption: 'Q2.2: with Qwen3.5-27B acting (196 tasks, September simulator), the real-trained monitor catches 89.2% [74.5, 91.7] of real and 88.7% [75.7, 91.5] of simulated impactful commands at a frozen 1% threshold (a second real run 87.2%); real − simulated is +0.46 points [−2.32, +2.50] and two real runs −1.98 [−4.41, +1.72], so a 10-point gap is ruled out and no gap is established; the same threshold gives 2.9% false alarms on simulated harmless commands vs 1.1% on real (levels are a post hoc export, branch aswin/d196-control). With each world''s own threshold targeting 1% false alarms (post hoc), real − simulated is +5.8 points [−6.3, +10.6] against two real runs'' run 2 − run 1 of +4.6 [−3.4, +9.6]; the thresholds achieve 3.03% false alarms in simulation vs 1.14% on real runs.'
  panels:
  - title: Caught at the frozen threshold targeting 1% false alarms
    kind: bars
    unit: percent
    ylabel: "Impactful commands caught (%)\n(higher is better)"
    lines: []
    bars:
    - {label: "Real\n(run 1)", role: real, ref: c389983764f9, path: experiments/2026-10-08_q3_onpolicy_figures/results/q22_levels_POSTHOC_2026-10-11_003931.json, key: 1% target (refit draws 1-500)/real catch (real → real)/catch_frozen/observed, lo_key: 1% target (refit draws 1-500)/real catch (real → real)/catch_frozen/ci95/0, hi_key: 1% target (refit draws 1-500)/real catch (real → real)/catch_frozen/ci95/1, scale: 100, value: 89.16, lo: 74.53, hi: 91.67}
    - {label: "Real\n(run 2)", role: real2, ref: c389983764f9, path: experiments/2026-10-08_q3_onpolicy_figures/results/q22_levels_POSTHOC_2026-10-11_003931.json, key: 1% target (refit draws 1-500)/run 2 catch (real → run 2)/catch_frozen/observed, lo_key: 1% target (refit draws 1-500)/run 2 catch (real → run 2)/catch_frozen/ci95/0, hi_key: 1% target (refit draws 1-500)/run 2 catch (real → run 2)/catch_frozen/ci95/1, scale: 100, value: 87.18, lo: 74.24, hi: 90.83}
    - {label: Simulated, role: sim, ref: c389983764f9, path: experiments/2026-10-08_q3_onpolicy_figures/results/q22_levels_POSTHOC_2026-10-11_003931.json, key: 1% target (refit draws 1-500)/simulated catch (real → sim)/catch_frozen/observed, lo_key: 1% target (refit draws 1-500)/simulated catch (real → sim)/catch_frozen/ci95/0, hi_key: 1% target (refit draws 1-500)/simulated catch (real → sim)/catch_frozen/ci95/1, scale: 100, value: 88.7, lo: 75.71, hi: 91.45}
  - title: Catch gaps at the frozen threshold targeting 1% false alarms
    kind: bars
    unit: points
    ylabel: "Difference (points)\n(closer to 0 is better)"
    lines:
    - {y: 10, label: +10 margin, source: {ref: 5564a2ee2e64, path: experiments/2026-10-08_q3_onpolicy_figures/plan_scaleup_196_scoring_2026-10-10.md, quote: margin 10 points., raw: '10', scale: 1, pm: true}}
    - {y: -10, label: −10 margin, source: {ref: 5564a2ee2e64, path: experiments/2026-10-08_q3_onpolicy_figures/plan_scaleup_196_scoring_2026-10-10.md, quote: margin 10 points., raw: '10', scale: 1, pm: true}}
    bars:
    - {label: Real − simulated, role: gap, ref: 5564a2ee2e64, path: experiments/2026-10-08_q3_onpolicy_figures/results/scaleup196_verdicts_2026-10-10_164622.json, key: endpoints/main_tpr_gap_real_minus_sim/observed, lo_key: endpoints/main_tpr_gap_real_minus_sim/ci95/0, hi_key: endpoints/main_tpr_gap_real_minus_sim/ci95/1, scale: 100, value: 0.46, lo: -2.32, hi: 2.5}
    - {label: "Real run 2 − run 1\n(control)", role: control, ref: 5564a2ee2e64, path: experiments/2026-10-08_q3_onpolicy_figures/results/scaleup196_verdicts_2026-10-10_164622.json, key: endpoints/catch_control_run2_minus_run1/observed, lo_key: endpoints/catch_control_run2_minus_run1/ci95/0, hi_key: endpoints/catch_control_run2_minus_run1/ci95/1, scale: 100, value: -1.98, lo: -4.41, hi: 1.72}
  - title: Each world's own threshold targeting 1% false alarms (post hoc)
    kind: bars
    unit: points
    ylabel: "Difference (points)\n(closer to 0 is better)"
    lines:
    - {y: 10, label: +10 margin, source: {ref: 5564a2ee2e64, path: experiments/2026-10-08_q3_onpolicy_figures/plan_scaleup_196_scoring_2026-10-10.md, quote: margin 10 points., raw: '10', scale: 1, pm: true}}
    - {y: -10, label: −10 margin, source: {ref: 5564a2ee2e64, path: experiments/2026-10-08_q3_onpolicy_figures/plan_scaleup_196_scoring_2026-10-10.md, quote: margin 10 points., raw: '10', scale: 1, pm: true}}
    bars:
    - {label: Real − simulated, role: gap, ref: c389983764f9, path: experiments/2026-10-08_q3_onpolicy_figures/results/q22_matched_fa_POSTHOC_2026-10-11_033516.json, key: targets/1%/gap real - sim/observed, lo_key: targets/1%/gap real - sim/ci95/0, hi_key: targets/1%/gap real - sim/ci95/1, scale: 100, value: 5.78, lo: -6.27, hi: 10.61}
    - {label: "Real run 2 − run 1\n(control)", role: control, ref: c389983764f9, path: experiments/2026-10-08_q3_onpolicy_figures/results/q22_matched_fa_POSTHOC_2026-10-11_033516.json, key: targets/1%/control run 1 - run 2/observed, lo_key: targets/1%/control run 1 - run 2/ci95/0, hi_key: targets/1%/control run 1 - run 2/ci95/1, scale: -100, value: 4.59, lo: -3.39, hi: 9.59}
- fig: Q2.3
  slug: threshold_set_in_sim
  ncols: 2
  title: A threshold set in simulation gives about 1% real false alarms when Sol acts; with Qwen acting it is inconclusive
  caption: 'Q2.3: a 1% threshold set on simulated runs gives 1.07% real false alarms when Sol acts (inside 0.5–2%); with Qwen acting, check (b) gives 1.19% [0.82, 2.57] and adding honest runs 2.64% [1.57, 4.75] per command (2.15% each task once); two honest runs differ (4.42% vs 1.89%), mostly from two long clinical-trial runs, so it stays inconclusive; at a 5% target, 6.66% (post hoc).'
  panels:
  - title: Sol acts, threshold set in simulation
    kind: bars
    unit: percent
    ylabel: "Real false alarms (%)\n(inside the band is better)"
    lines:
    - {y: 1.0, label: 1% target}
    - {band: [0.5, 2.0], label: 0.5–2%}
    bars:
    - {label: Real-trained probe, role: real, ref: 5564a2ee2e64, path: experiments/2026-10-09_q2_threshold_in_sim/README.md, scale: 100, value: 1.07, lo: 0.55, hi: 1.74, quote: '"real FPR": 0.0107, "real FPR 95% (task resamples, thresholds recomputed)": [0.0055, 0.0174]', n: 530 tasks, n_quote: Off-policy (530 tasks), raw: ['0.0107', '0.0055', '0.0174']}
    - {label: "Trained in\nsimulation", role: real, ref: 5564a2ee2e64, path: experiments/2026-10-09_q2_threshold_in_sim/README.md, scale: 100, value: 1.23, lo: 0.71, hi: 2.13, quote: '"real FPR": 0.0123, "real FPR 95% (task resamples, thresholds recomputed)": [0.0071, 0.0213]', n: 530 tasks, n_quote: Off-policy (530 tasks), raw: ['0.0123', '0.0071', '0.0213']}
    ylim:
