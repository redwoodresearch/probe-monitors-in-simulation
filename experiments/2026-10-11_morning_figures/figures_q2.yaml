- fig: Q2.4
  slug: acting_vs_reading
  title: 'Acting vs reading: the real-vs-simulated gap does not change in ranking quality'
  caption: 'Q2.4: the real-vs-simulated gap is the same whether Qwen acts or reads (184 tasks): in ranking quality D = −0.002 [−0.014, +0.011], so a 0.03 change is ruled out (control passes); in catch at 1% D_catch = +0.5 points [−3.3, +5.1], but its two-real-runs control fails (+2.3 [−2.1, +7.7]), so that is inconclusive.'
  panels:
  - title: Ranking quality (AUROC gap)
    kind: bars
    unit: AUROC diff
    ylabel: "Change in gap (AUROC)\n(closer to 0 is better)"
    lines:
