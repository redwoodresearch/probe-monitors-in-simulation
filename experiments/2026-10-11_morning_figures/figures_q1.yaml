  - title: Before vs after evening
    kind: bars
    unit: AUROC
    ylabel: AUROC
    bars:
    - {label: Before, role: sim, pending: 'Q1.1 round two (b7, cf83b457), due after about 01:10'}
    - {label: After, role: sim, pending: 'Q1.1 round two (b7, cf83b457), due after about 01:10'}
- fig: Q1.1c
  slug: qwen_vs_llama
  title: 'Qwen3-32B vs a small model (Llama-3.2-1B) on the same runs: Qwen ranks better, but not at a 1% target'
  caption: 'Q1.1c (post hoc, paired, 5 held-out environments, 946 runs): Qwen3-32B minus Llama-3.2-1B is +0.117 [+0.088, +0.146] in AUROC and +18.4 points [+4.5, +26.8] in catch at 5%, but −4.4 [−10.6, +6.2] at a 1% target, so at 1% neither model is shown to be better. Catch at 1% and 5% has no grouped label-shuffle null yet (#514 ruling), so read those bars as descriptive.'
  panels:
  - title: 'Caught: Qwen minus Llama'
    kind: bars
    unit: points
    ylabel: "Difference (points)\n(above 0: Qwen catches more)"
    bars:
    - {label: At 1%, role: gap, ref: 51a178ee5aa7, path: experiments/2026-10-09_fixed_sim/results/figure_numbers/qwen_vs_llama_POSTHOC_trim_2026-10-11_003609.json, key: test 5/difference_qwen_minus_llama/at_1pct/value, lo_key: test 5/difference_qwen_minus_llama/at_1pct/ci95/0, hi_key: test 5/difference_qwen_minus_llama/at_1pct/ci95/1, scale: 100, value: -4.44, lo: -10.61, hi: 6.23}
    - {label: At 5%, role: gap, ref: 51a178ee5aa7, path: experiments/2026-10-09_fixed_sim/results/figure_numbers/qwen_vs_llama_POSTHOC_trim_2026-10-11_003609.json, key: test 5/difference_qwen_minus_llama/at_5pct/value, lo_key: test 5/difference_qwen_minus_llama/at_5pct/ci95/0, hi_key: test 5/difference_qwen_minus_llama/at_5pct/ci95/1, scale: 100, value: 18.39, lo: 4.52, hi: 26.81}
  - title: 'AUROC: Qwen minus Llama'
    kind: bars
    unit: AUROC diff
    ylabel: "Difference in AUROC\n(above 0: Qwen ranks better)"
    bars:
    - {label: AUROC, role: gap, ref: 51a178ee5aa7, path: experiments/2026-10-09_fixed_sim/results/figure_numbers/qwen_vs_llama_POSTHOC_trim_2026-10-11_003609.json, key: test 5/difference_qwen_minus_llama/auroc/value, lo_key: test 5/difference_qwen_minus_llama/auroc/ci95/0, hi_key: test 5/difference_qwen_minus_llama/auroc/ci95/1, scale: 1, value: 0.117, lo: 0.088, hi: 0.146}
- fig: Q1.2
