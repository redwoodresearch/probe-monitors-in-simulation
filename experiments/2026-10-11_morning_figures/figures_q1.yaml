# Morning figures spec: what each figure draws and where each number comes from (read by plot_morning_figures.py).
figures:
- fig: Q1.1
  slug: fixed_sim_probe
  title: Reading Sol's fixed runs, the probe ranks simulated above real runs (AUROC 0.82) but catches few at a 1% target
  caption: 'Q1.1: reading Sol''s fixed runs (5 held-out environments, 473 runs per arm), the Qwen3-32B probe ranks fixed simulated runs above real ones (AUROC 0.822 [0.795, 0.848], above its fixed-probe shuffled-label null in every environment, p = 0.001; two real runs 0.528, inside step A''s selection-aware null, p = 0.079) but catches only 2.7% [1.1, 20.8] at a 1% false-alarm target (two real runs 1.1%) and 40.0% at 5% (two real runs 8.2%); post hoc metric, threshold set on about 5 real runs. Catch at 1% and 5% has no grouped label-shuffle null yet (#514 ruling), so read those bars as descriptive.'
  panels:
  - title: Caught at a 1% and 5% false-alarm target
    kind: bars
    unit: percent
    ylabel: "Runs caught (%)\n(higher = more separable)"
    lines:
    - {y: 1.0, label: 1%}
    - {y: 5.0, label: 5%}
    ylim:
    - 0
    - 60
    bars:
    - {label: "Sim vs real,\n1%", role: sim, ref: 51a178ee5aa7, path: experiments/2026-10-09_fixed_sim/results/figure_numbers/catch_rows_2026-10-10_235259.json, key: rows/2/at_1pct/caught_share, lo_key: rows/2/at_1pct/caught_ci95/0, hi_key: rows/2/at_1pct/caught_ci95/1, scale: 100, value: 2.75, lo: 1.05, hi: 20.78}
    - {label: "Two real runs,\n1%", role: real2, ref: 51a178ee5aa7, path: experiments/2026-10-09_fixed_sim/results/figure_numbers/catch_rows_2026-10-10_235259.json, key: rows/3/at_1pct/caught_share, lo_key: rows/3/at_1pct/caught_ci95/0, hi_key: rows/3/at_1pct/caught_ci95/1, scale: 100, value: 1.06, lo: 0.21, hi: 3.91}
    - {label: "Sim vs real,\n5%", role: sim, ref: 51a178ee5aa7, path: experiments/2026-10-09_fixed_sim/results/figure_numbers/catch_rows_2026-10-10_235259.json, key: rows/2/at_5pct/caught_share, lo_key: rows/2/at_5pct/caught_ci95/0, hi_key: rows/2/at_5pct/caught_ci95/1, scale: 100, value: 39.96, lo: 24.35, hi: 48.53}
    - {label: "Two real runs,\n5%", role: real2, ref: 51a178ee5aa7, path: experiments/2026-10-09_fixed_sim/results/figure_numbers/catch_rows_2026-10-10_235259.json, key: rows/3/at_5pct/caught_share, lo_key: rows/3/at_5pct/caught_ci95/0, hi_key: rows/3/at_5pct/caught_ci95/1, scale: 100, value: 8.25, lo: 3.89, hi: 11.18}
  - title: ROC, log false-alarm axis
    kind: roc
    ylabel: Runs caught (true-positive rate)
    fpr_lines:
    - 0.01
    - 0.05
    curves:
    - {label: Sim vs real, role: sim, ref: 51a178ee5aa7, path: experiments/2026-10-09_fixed_sim/results/figure_numbers/roc_points_2026-10-11.json, fpr_key: fpr_grid, tpr_key: curves/1/tpr}
    - {label: Two real runs, role: real2, ref: 51a178ee5aa7, path: experiments/2026-10-09_fixed_sim/results/figure_numbers/roc_points_2026-10-11.json, fpr_key: fpr_grid, tpr_key: curves/3/tpr}
  - title: 'Ranking score (AUROC); nulls: see caption p-values'
    kind: bars
    unit: AUROC
    ylabel: "AUROC\n(0.5 = chance; higher = more separable)"
    ylim:
    - 0
    - 1.1
    bars:
    - {label: Sim vs real, role: sim, ref: 51a178ee5aa7, path: experiments/2026-10-09_fixed_sim/results/figure_numbers/catch_rows_2026-10-10_235259.json, key: rows/2/auroc, lo_key: rows/2/auroc_ci95/0, hi_key: rows/2/auroc_ci95/1, scale: 1, value: 0.822, lo: 0.795, hi: 0.848}
    - {label: Two real runs, role: real2, ref: 51a178ee5aa7, path: experiments/2026-10-09_fixed_sim/results/figure_numbers/catch_rows_2026-10-10_235259.json, key: rows/3/auroc, lo_key: rows/3/auroc_ci95/0, hi_key: rows/3/auroc_ci95/1, scale: 1, value: 0.528, lo: 0.5, hi: 0.559}
- fig: Q1.1b
  slug: round_two_evened_slips
  title: 'Round two: the fixed-simulation probe before and after evening the four leftover slips'
  caption: 'Q1.1b: b7''s B-dev test (plan and script cf83b457): four leftover slips evened in both arms, 5 dev environments, frozen per-environment probes; gap, AUROC, catch at 1%/5%, two real runs and the planted undo check, before vs after.'
