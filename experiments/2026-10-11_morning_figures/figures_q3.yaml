    - {label: "Attack runs:\nrun 2 − run 1", role: control, ref: 5564a2ee2e64, path: experiments/2026-10-10_q2_deception_runlevel/results/runlevel_analysis_2026-10-10_215302.json, key: 'part 2: September simulated vs real attack runs/confirmatory (t21-t196)/C (run 2 - run 1, real-vs-real)/mean (s_H)', lo_key: 'part 2: September simulated vs real attack runs/confirmatory (t21-t196)/C (run 2 - run 1, real-vs-real)/95% (task bootstrap)/0', hi_key: 'part 2: September simulated vs real attack runs/confirmatory (t21-t196)/C (run 2 - run 1, real-vs-real)/95% (task bootstrap)/1', scale: 1, value: 0.01, lo: -0.12, hi: 0.13}
