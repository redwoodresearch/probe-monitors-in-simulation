- fig: Q3.3
  slug: eval_awareness_lines
  title: An eval line moves the turn-start readout more than a neutral line; on content tokens both effects are tiny
  caption: 'Q3.3 (exploratory, 99 real runs): at the turn-start template slot an inserted eval line moves the probe 0.26× its made-up-dialogue effect far from the reading point (neutral line −0.06×) and 2.10× near it (neutral +0.33×), and near may reflect closeness to the line; on content tokens (version A, per token) both lines move it under 0.06×, and far from the turn the neutral line moves it more (0.029× vs 0.017×), so the template-slot effect is not seen in the content-token readout.'
  panels:
  - title: Template-slot readout (turn start, version B)
    kind: bars
    unit: ratio
    ylabel: "Score shift / made-up-dialogue effect (×)\n(eval line: higher transfers; neutral: near 0)"
    lines:
    - {y: 1.0, label: 1×}
    bars:
    - {label: "Far:\neval line", role: real, ref: 5564a2ee2e64, path: experiments/2026-10-10_eval_awareness_probe/results/neutral_analysis_2026-10-11_000505.json, key: far/eval effect/fraction, lo_key: far/eval effect/fraction 95%/0, hi_key: far/eval effect/fraction 95%/1, scale: 1, value: 0.26, lo: 0.21, hi: 0.39}
    - {label: "Far:\nneutral line", role: control, ref: 5564a2ee2e64, path: experiments/2026-10-10_eval_awareness_probe/results/neutral_analysis_2026-10-11_000505.json, key: far/neutral effect (linux)/fraction, lo_key: far/neutral effect (linux)/fraction 95%/0, hi_key: far/neutral effect (linux)/fraction 95%/1, scale: 1, value: -0.06, lo: -0.09, hi: -0.04}
    - {label: "Near:\neval line", role: real, ref: 5564a2ee2e64, path: experiments/2026-10-10_eval_awareness_probe/results/neutral_analysis_2026-10-11_000505.json, key: near/eval effect/fraction, lo_key: near/eval effect/fraction 95%/0, hi_key: near/eval effect/fraction 95%/1, scale: 1, value: 2.1, lo: 1.89, hi: 3.19}
    - {label: "Near:\nneutral line", role: control, ref: 5564a2ee2e64, path: experiments/2026-10-10_eval_awareness_probe/results/neutral_analysis_2026-10-11_000505.json, key: near/neutral effect (linux)/fraction, lo_key: near/neutral effect (linux)/fraction 95%/0, hi_key: near/neutral effect (linux)/fraction 95%/1, scale: 1, value: 0.33, lo: 0.29, hi: 0.51}
    - {label: "Matched\npairs", role: gap, pending: 'Q3.3 matched-pairs result (ea1 session, overnight)'}
  - title: Content-token readout (version A, per token)
    kind: bars
    unit: ratio3
    ylabel: Score shift / made-up-dialogue effect (×)
    lines: []
    bars:
    - {label: "Far:\neval line", role: real, ref: 5564a2ee2e64, path: experiments/2026-10-10_eval_awareness_probe/results/neutral_analysis_A_per_token_2026-10-11_003153.json, key: far/eval effect/fraction, lo_key: far/eval effect/fraction 95%/0, hi_key: far/eval effect/fraction 95%/1, scale: 1, value: 0.0167, lo: 0.0139, hi: 0.0188}
    - {label: "Far:\nneutral line", role: control, ref: 5564a2ee2e64, path: experiments/2026-10-10_eval_awareness_probe/results/neutral_analysis_A_per_token_2026-10-11_003153.json, key: far/neutral effect (linux)/fraction, lo_key: far/neutral effect (linux)/fraction 95%/0, hi_key: far/neutral effect (linux)/fraction 95%/1, scale: 1, value: 0.0288, lo: 0.0234, hi: 0.0331}
    - {label: "Near:\neval line", role: real, ref: 5564a2ee2e64, path: experiments/2026-10-10_eval_awareness_probe/results/neutral_analysis_A_per_token_2026-10-11_003153.json, key: near/eval effect/fraction, lo_key: near/eval effect/fraction 95%/0, hi_key: near/eval effect/fraction 95%/1, scale: 1, value: 0.0575, lo: 0.0481, hi: 0.065}
