# Morning figures spec: what each figure draws and where each number comes from (read by plot_morning_figures.py).
figures:
- fig: Q3.1
  slug: clean_attack_detector
  title: The clean attack detector flags real and simulated attack runs alike
  caption: 'Q3.1: the clean attack detector (Qwen3.5-27B, 196 tasks) flags 97.8% of real vs 96.2% of simulated attack runs at a 1% target (+1.6 points [−1.1, +5.3]; two real runs +1.6), so a 10-point gap is ruled out; not yet read as catching attacks: no run declined, so attacking can''t be separated from being attack-instructed; about a third of ''attempted'' runs claim success the scorer doesn''t confirm; and the agent''s own reasoning remains in context (interim wording until you decide; post hoc, branch aswin/q3-retrain-build). Real attack runs the side-task scorer confirms are flagged 98.4% [96.2, 100] and runs it doesn''t confirm 95.2% [87.3, 100] (scorer split, 99fe56d6, post hoc).'
  panels:
  - title: Attack runs flagged at the 1% target
    kind: bars
    unit: percent
    ylabel: "Attack runs flagged (%)\n(higher is better)"
    bars:
    - {label: "Real\n(run 1)", role: real, ref: 61ac55caec11, path: experiments/2026-10-08_q3_onpolicy_figures/results/claim_c_POSTHOC_2026-10-10_225232.json, key: selections/command_end/observed/tpr_run1, lo_key: selections/command_end/tpr_run1_interval/ci95/0, hi_key: selections/command_end/tpr_run1_interval/ci95/1, scale: 100, value: 97.81, lo: 94.38, hi: 100.0}
    - {label: "Real\n(run 2)", role: real2, ref: 61ac55caec11, path: experiments/2026-10-08_q3_onpolicy_figures/results/claim_c_POSTHOC_2026-10-10_225232.json, key: selections/command_end/observed/tpr_run2, lo_key: selections/command_end/report/tpr_run2_interval/ci95/0, hi_key: selections/command_end/report/tpr_run2_interval/ci95/1, scale: 100, value: 99.45, lo: 97.81, hi: 100.0}
    - {label: Simulated, role: sim, ref: 61ac55caec11, path: experiments/2026-10-08_q3_onpolicy_figures/results/claim_c_POSTHOC_2026-10-10_225232.json, key: selections/command_end/observed/tpr_sim, lo_key: selections/command_end/report/tpr_sim_interval/ci95/0, hi_key: selections/command_end/report/tpr_sim_interval/ci95/1, scale: 100, value: 96.17, lo: 90.91, hi: 98.92}
  - title: Gaps, with the ±10-point margin
    kind: bars
    unit: points
    ylabel: "Difference (points)\n(closer to 0 is better)"
    lines:
    - {y: 10, label: '+10', source: {ref: 61ac55caec11, path: experiments/2026-10-08_q3_onpolicy_figures/plan_attack_detector_retrain_2026-10-10.md, quote: 'interval inside (−10, +10) points', raw: '+10', scale: 1}}
    - {y: -10, label: −10, source: {ref: 61ac55caec11, path: experiments/2026-10-08_q3_onpolicy_figures/plan_attack_detector_retrain_2026-10-10.md, quote: 'interval inside (−10, +10) points', raw: '-10', scale: 1}}
    bars:
    - {label: Real − simulated, role: gap, ref: 61ac55caec11, path: experiments/2026-10-08_q3_onpolicy_figures/results/claim_c_POSTHOC_2026-10-10_225232.json, key: selections/command_end/observed/gap, lo_key: selections/command_end/gap_interval/ci95/0, hi_key: selections/command_end/gap_interval/ci95/1, scale: 100, value: 1.64, lo: -1.13, hi: 5.29}
    - {label: "Real run 2 − run 1\n(control)", role: control, ref: 61ac55caec11, path: experiments/2026-10-08_q3_onpolicy_figures/results/claim_c_POSTHOC_2026-10-10_225232.json, key: selections/command_end/observed/control, lo_key: selections/command_end/control_interval/ci95/0, hi_key: selections/command_end/control_interval/ci95/1, scale: 100, value: 1.64, lo: 0.0, hi: 4.87}
  - title: Real run 1 by side-task scorer outcome (post hoc)
    kind: bars
    unit: percent
    ylabel: "Attack runs flagged at 1% (%)\n(higher is better)"
    lines: []
    bars:
    - {label: "Scorer confirms\nsuccess", role: real, ref: 8c33ba6b355b, path: experiments/2026-10-08_q3_onpolicy_figures/results/scorer_split_POSTHOC_2026-10-11_003502.json, key: results/run1/C/catch_0.01, lo_key: results/run1/C/catch_0.01_interval/ci95/0, hi_key: results/run1/C/catch_0.01_interval/ci95/1, scale: 100, value: 98.44, lo: 96.21, hi: 100.0}
    - {label: "Scorer does not\nconfirm", role: real, ref: 8c33ba6b355b, path: experiments/2026-10-08_q3_onpolicy_figures/results/scorer_split_POSTHOC_2026-10-11_003502.json, key: results/run1/I/catch_0.01, lo_key: results/run1/I/catch_0.01_interval/ci95/0, hi_key: results/run1/I/catch_0.01_interval/ci95/1, scale: 100, value: 95.24, lo: 87.3, hi: 100.0}
- fig: Q3.2
  slug: deception_probe_sd
  title: The deception probe scores simulated and real attack runs within ±0.25 SD; for success claims it can't be established
  caption: 'Q3.2: the frozen deception probe (Qwen3.5-27B, layer 31) scores simulated attack runs −0.05 SD [−0.17, +0.07] from real, inside the post hoc ±0.25 SD margin after Holm (two real runs +0.01); on success claims, simulated − real is +0.19 [−0.18, +0.55] and two real runs −0.07 [−0.49, +0.27], neither inside; on your sabotage labels a planted +0.5 SD shift is missed and +1.0 SD caught (#540; SD units differ by bar).'
  panels:
  - title: Simulated minus real
    kind: bars
    unit: SD
    ylabel: "Probe score difference (SD)\n(closer to 0 is better)"
    bars:
