- fig: Q3.3b
  slug: eval_awareness_real_vs_sim
  title: 'Eval-awareness: the turn-start estimate depends on the real reference; pooling establishes neither a direction beyond ±0.05 nor equivalence within that margin'
  caption: 'Q3.3b (840 matched cells, 501 tasks; B = turn start, A = content retrained, Old = original probe): Δc for simulated runs is −0.006 vs real run 1 and +0.056 [+0.019, +0.091] vs real run 2 at the turn start (B), so single reference runs disagree; pooled over both real runs (post hoc) it is +0.025 [−0.002, +0.051] (B), −0.023 (A) and −0.037 [−0.064, −0.009] (Old), against its label-permutation null band (permuted within each task; diagnostic), B''s +0.025 and A''s −0.023 sit inside (bands about ±0.027) while Old''s −0.037 falls below its band (−0.026); no direction is established under the ±0.05 margin, and equivalence within it is not shown; for scale, real run 1 with an explicit far eval line against real run 2 gives +0.123 [+0.090, +0.155] (B), +0.032 (A) and −0.016 (Old) in the same pooled terms, which include the baseline difference between the two real runs; the cue''s own effect against run 2 is +0.142, +0.029 and +0.019 (PRs #550–#553, #596).'
  panels:
  - title: Simulated vs real run 1
    kind: bars
    unit: diff3
    ylabel: "Share of cells reading higher,\nminus real vs real (closer to 0 is better)"
    lines:
    - {y: 0.05, label: +0.05 margin, source: {ref: bafd1eb5d1de, path: experiments/2026-10-11_eval_awareness_real_vs_sim/results/real_vs_sim_analysis_2026-10-11_012129.json, key: margins/dc, pm: true}}
    - {y: -0.05, label: −0.05 margin, source: {ref: bafd1eb5d1de, path: experiments/2026-10-11_eval_awareness_real_vs_sim/results/real_vs_sim_analysis_2026-10-11_012129.json, key: margins/dc, pm: true}}
    bars:
    - {label: B, role: gap, ref: 424ce2867355, path: experiments/2026-10-11_eval_awareness_real_vs_sim/results/planted_power_2026-10-11_014610.json, key: 'B/observed dc (sim vs e1, minus e2 vs e1), same cells', lo_key: B/observed dc 95%/0, hi_key: B/observed dc 95%/1, scale: 1, value: -0.006, lo: -0.0449, hi: 0.0333}
    - {label: A, role: gap, ref: 424ce2867355, path: experiments/2026-10-11_eval_awareness_real_vs_sim/results/planted_power_2026-10-11_014610.json, key: 'A/observed dc (sim vs e1, minus e2 vs e1), same cells', lo_key: A/observed dc 95%/0, hi_key: A/observed dc 95%/1, scale: 1, value: -0.0143, lo: -0.053, hi: 0.0249}
    - {label: Old, role: gap, ref: 424ce2867355, path: experiments/2026-10-11_eval_awareness_real_vs_sim/results/planted_power_2026-10-11_014610.json, key: 'old/observed dc (sim vs e1, minus e2 vs e1), same cells', lo_key: old/observed dc 95%/0, hi_key: old/observed dc 95%/1, scale: 1, value: -0.0512, lo: -0.0889, hi: -0.0131}
    ylim:
    - -0.13
    - 0.13
  - title: Simulated vs real run 2
    kind: bars
    unit: diff3
    ylabel: "Share of cells reading higher,\nminus real vs real (closer to 0 is better)"
    lines:
    - {y: 0.05, label: +0.05 margin, source: {ref: bafd1eb5d1de, path: experiments/2026-10-11_eval_awareness_real_vs_sim/results/real_vs_sim_analysis_2026-10-11_012129.json, key: margins/dc, pm: true}}
